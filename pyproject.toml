[project]
name = "toolkit-helper-agents"
version = "0.1.0"
description = "Setting up LLM based autonomous agents with LangChain's wrappers and tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langchain-classic",
    "langchain-openai",
    "langchain-core",
    "langchain-experimental",
    "langchain-ibm",
    "ibm-watsonx-ai",
    "openai",
    "pandas",
    "numpy",
    "scikit-learn"
]

[project.scripts]
toolkit-helper-agents = "toolkit_helper_agents:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
